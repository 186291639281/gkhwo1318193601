<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sign in — Earning Math Game</title>
  <link rel="stylesheet" href="login.css" />
</head>
<body>
  <div class="bg">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
  </div>

  <main class="card" role="main" aria-labelledby="title">
    <div class="brand">
      <h1 id="title">Earning Math Game</h1>
      <p class="tag">Solve quick math problems, earn coins and cash — sign in to save progress.</p>
    </div>

    <div class="auth">
      <button id="google-signin" class="btn fb" aria-label="Sign in with Google">
        <!-- Google logo -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 533.5 544.3" width="18" height="18" style="margin-right:8px"><path fill="#4285f4" d="M533.5 278.4c0-17.7-1.6-35-4.6-51.6H272v97.7h147.1c-6.3 34-25.9 62.8-55.3 82v68.2h89.3c52.3-48.2 84.4-119.4 84.4-196.3z"/><path fill="#34a853" d="M272 544.3c74 0 136-24.5 181.3-66.7l-89.3-68.2c-24.8 16.7-56.7 26.6-92 26.6-70.7 0-130.6-47.7-152-111.7H28.5v70.3C73.4 486.6 167.1 544.3 272 544.3z"/><path fill="#fbbc04" d="M120 324.3c-11.8-35-11.8-72.6 0-107.6V146.4H28.5C10.1 186.5 0 221.7 0 258.7s10.1 72.2 28.5 112.3L120 324.3z"/><path fill="#ea4335" d="M272 107.9c39.9 0 75.7 13.7 104 40.6l78-78C407.8 24 344.9 0 272 0 167.1 0 73.4 57.7 28.5 146.4l91.5 70.3C141.4 155.6 201.3 107.9 272 107.9z"/></svg>
        Sign in with Google
      </button>

      <div class="or">or</div>

      <button id="guest" class="btn ghost" aria-label="Continue as guest">Continue as guest</button>

      <div id="login-error" class="feedback" role="status" aria-live="polite"></div>
    </div>

    <footer class="foot">
      <small>We use Firebase Authentication (Google). Your progress is stored securely.</small>
    </footer>
  </main>

  <script type="module">
    import { signInWithGoogle, onAuthChange } from './auth.js';

    const googleBtn = document.getElementById('google-signin');
    const guestBtn = document.getElementById('guest');
    const errorEl = document.getElementById('login-error');

    googleBtn.addEventListener('click', async () => {
      errorEl.textContent = '';
      googleBtn.disabled = true;
      try {
        await signInWithGoogle();
        // auth flow will trigger onAuthChange and redirect
      } catch (err) {
        errorEl.textContent = err?.message || 'Sign-in failed. Please try again.';
        errorEl.className = 'feedback error';
        googleBtn.disabled = false;
      }
    });

    guestBtn.addEventListener('click', () => {
      // optional guest flow: go to game without saving to Firestore
      window.location.href = 'game.html';
    });

    onAuthChange((user) => {
      if (user) {
        // signed in — redirect to game
        window.location.href = 'game.html';
      } else {
        // show page normally
      }
    });
  </script>
</body>
</html>
