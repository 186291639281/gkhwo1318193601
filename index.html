<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sign in — Earning Math Game</title>
  <link rel="stylesheet" href="login.css" />
</head>
<body>
  <div class="bg">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
  </div>

  <main class="card" role="main" aria-labelledby="title">
    <div class="brand">
      <h1 id="title">Earning Math Game</h1>
      <p class="tag">Solve quick math problems, earn coins and cash — sign in to save progress.</p>
    </div>

    <div class="auth">
      <button id="fb-signin" class="btn fb" aria-label="Sign in with Facebook">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" style="margin-right:8px">
          <path d="M22 12C22 6.48 17.52 2 12 2S2 6.48 2 12c0 4.84 3.44 8.84 7.94 9.77v-6.92H7.9v-2.85h2.04V9.84c0-2.02 1.2-3.14 3.04-3.14.88 0 1.8.16 1.8.16v1.98h-1.02c-1.01 0-1.32.63-1.32 1.28v1.53h2.24l-.36 2.85h-1.88V21.8C18.56 20.84 22 16.84 22 12z" fill="#fff"/>
        </svg>
        Sign in with Facebook
      </button>

      <div class="or">or</div>

      <button id="guest" class="btn ghost" aria-label="Continue as guest">Continue as guest</button>

      <div id="login-error" class="feedback" role="status" aria-live="polite"></div>
    </div>

    <footer class="foot">
      <small>We use Firebase Authentication (Facebook). Your progress is stored securely.</small>
    </footer>
  </main>

  <script type="module">
    import { signInWithFacebook, onAuthChange } from './auth.js';

    const fbBtn = document.getElementById('fb-signin');
    const guestBtn = document.getElementById('guest');
    const errorEl = document.getElementById('login-error');

    fbBtn.addEventListener('click', async () => {
      errorEl.textContent = '';
      fbBtn.disabled = true;
      try {
        await signInWithFacebook();
        // auth flow will trigger onAuthChange and redirect
      } catch (err) {
        errorEl.textContent = err?.message || 'Sign-in failed. Please try again.';
        errorEl.className = 'feedback error';
        fbBtn.disabled = false;
      }
    });

    guestBtn.addEventListener('click', () => {
      // optional guest flow: go to game without saving to Firestore
      window.location.href = 'game.html';
    });

    onAuthChange((user) => {
      if (user) {
        // signed in — redirect to game
        window.location.href = 'game.html';
      } else {
        // show page normally
      }
    });
  </script>
</body>
</html>
